[project]
name = "utsav"
version = "1.0.0"
description = "Culture-native GenAI event planning assistant for Indian celebrations"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "PIE",
    "SIM",
    "RUF"
]
ignore = [
    "E501",   # Line too long (handled by formatter / long prompt strings)
    "RUF001", # Ambiguous unicode character (Indian currency symbol, Devanagari script, em-dashes)
    "E402",   # Module level import not at top of file (sys.path manipulation in Alembic / main)
    "B904",   # Within an except clause, raise exceptions with raise ... from err (FastAPI HTTPExceptions)
    "RUF012", # Mutable default value for class attribute (class constants)
    "SIM116", # Use a dictionary instead of consecutive if statements
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.Body",
    "fastapi.Path",
    "Depends",
    "Query",
    "Header",
    "File",
    "Security",
    "Body",
    "Path"
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ephem",
    "backend.app.services.providers.openai_provider",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring real live external API credentials (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
