[project]
name = "utsav"
version = "1.0.0"
description = "Culture-native GenAI event planning assistant for Indian celebrations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "python-multipart>=0.0.18",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
    "ephem>=4.2.0",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "radon>=6.0.1",
    "jsonschema>=4.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "PIE",
    "SIM",
    "RUF",
    "BLE",
    "S",
    "PTH",
    "T20",
    "C90",
    "ANN",
    "ARG",
    "TRY",
    "N",
    "PL",
    "RET",
    "ERA",
]
ignore = [
    "RUF001", # Ambiguous unicode character (Indian currency symbol, Devanagari script, em-dashes)
    "RUF002", # Docstring ambiguous unicode character
    "RUF003", # Comment ambiguous unicode character
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101", "ARG"]

[tool.ruff.lint.pylint]
max-args = 15
max-positional-args = 15
max-returns = 12
max-statements = 100
allow-magic-value-types = ["int", "float", "str", "bytes"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.Body",
    "fastapi.Path",
    "Depends",
    "Query",
    "Header",
    "File",
    "Security",
    "Body",
    "Path"
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ephem",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring real live external API credentials (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
