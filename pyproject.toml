[project]
name = "utsav"
version = "1.0.0"
description = "Culture-native GenAI event planning assistant for Indian celebrations"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "PIE",
    "SIM",
    "RUF",
    "BLE",
    "S",
    "PTH",
    "T20",
    "C90",
]
ignore = [
    "RUF001", # Ambiguous unicode character (Indian currency symbol, Devanagari script, em-dashes)
    "RUF002", # Docstring ambiguous unicode character
    "RUF003", # Comment ambiguous unicode character
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.Body",
    "fastapi.Path",
    "Depends",
    "Query",
    "Header",
    "File",
    "Security",
    "Body",
    "Path"
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ephem",
    "backend.app.services.providers.openai_provider",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests as requiring real live external API credentials (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
