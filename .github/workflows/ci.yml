name: Utsav Automated CI Loop Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  loop-gate-tests:
    name: Deterministic & Schema Regression Loop Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema pydantic

      - name: Run Deterministic Unit Tests
        run: |
          pytest tests/unit/ -v

      - name: Run Schema Regression Tests
        run: |
          pytest tests/schema/ -v

      - name: Run Golden Event Evaluation Suite
        run: |
          pytest tests/eval/ -v

      - name: Verification Summary
        if: success()
        run: echo "Utsav CI Loop Gate Passed All Gates!"
