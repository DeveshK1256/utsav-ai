name: Utsav Automated CI Loop Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  loop-gate-tests:
    name: Deterministic & Schema Regression Loop Gate
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./ci_test.db
      WHATSAPP_PROVIDER: mock
      ENABLE_M4_WHATSAPP: "true"
      TESTING: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install jsonschema ruff mypy

      # Linting & Static Typing Quality Gates:
      # Error threshold strategy: Ruff and MyPy provide continuous static analysis visibility.
      # In this active prototype/evaluation phase, ruff and mypy run in report-or-warn mode
      # (`continue-on-error: true`) to surface code quality issues without false-blocking urgent
      # evaluation fixes, whereas deterministic unit/schema tests and frontend production build
      # (`npm run build`) serve as non-negotiable hard blocking gates.
      - name: Code Quality Lint (Ruff)
        continue-on-error: true
        run: |
          ruff check backend/

      - name: Static Type Check (MyPy)
        continue-on-error: true
        run: |
          mypy backend/app --explicit-package-bases --ignore-missing-imports

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Frontend Production Build Gate (Hard Gate)
        working-directory: frontend
        run: npm run build

      - name: Run Deterministic Unit Tests
        run: |
          pytest tests/unit/ -v --tb=short || {
            python -c "
            import subprocess
            res = subprocess.run(['pytest', 'tests/unit/', '-v', '--tb=short', '-q'], capture_output=True, text=True)
            for l in res.stdout.splitlines():
                if 'FAILED' in l or 'AssertionError' in l or 'assert' in l:
                    print(f'::error::{l}')
            print(res.stdout[-4000:])
            "
            exit 1
          }

      - name: Run Schema Regression Tests
        run: |
          pytest tests/schema/ -v

      - name: Run Golden Event Evaluation Suite
        run: |
          pytest tests/eval/ -v

      - name: Verification Summary
        if: success()
        run: echo "Utsav CI Loop Gate Passed All Gates!"
