name: Utsav Automated CI Loop Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  loop-gate-tests:
    name: Deterministic & Schema Regression Loop Gate
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      DATABASE_URL: sqlite:///./ci_test.db
      WHATSAPP_PROVIDER: mock
      ENABLE_M4_WHATSAPP: "true"
      TESTING: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install jsonschema ruff mypy

      # Linting & Static Typing Quality Ratchet Gates:
      # Rather than permanent pass-through (`continue-on-error: true`), we enforce a strict quality
      # ratchet against `.github/ci_baseline.json` (established in Audit V3: 932 Ruff, 279 MyPy).
      # If any commit introduces new linting or typing regressions exceeding the baseline, this step
      # fails and blocks the build, preventing code quality rot while allowing incremental cleanup.
      - name: Code Quality Lint Ratchet Gate (Ruff)
        run: |
          python scripts/ci_ratchet.py ruff

      - name: Static Type Check Ratchet Gate (MyPy)
        run: |
          python scripts/ci_ratchet.py mypy

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Frontend Production Build Gate (Hard Gate)
        working-directory: frontend
        run: npm run build

      - name: Run Deterministic Unit Tests
        run: |
          python scripts/ci_test_runner.py tests/unit/

      - name: Run Schema Regression Tests
        run: |
          python scripts/ci_test_runner.py tests/schema/

      - name: Run Golden Event Evaluation Suite
        run: |
          python scripts/ci_test_runner.py tests/eval/

      - name: Verification Summary
        if: success()
        run: echo "Utsav CI Loop Gate Passed All Gates!"
